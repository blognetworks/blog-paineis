<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- 全平台图标生成: http://realfavicongenerator.net/  -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <meta name="theme-color" content="#ffffff">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- jekyll 404 页面 -->
  {% if page.url == "/404.html" %}
  <meta http-equiv="refresh" content="1; url=/404.html">
  {% endif %}

  <!-- 标题自动选择: 网站标题 / Post标题  -->
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
 
  <!-- SEO YML自定义优化标签(可选) -->
  <meta name="mate" content="{{ page.meta }}" />
 

  
  <!-- Pré-pintura do tema: aplica o tema salvo antes do CSS (sem flash). "Sistema" = sem atributo. -->
  <script>try{var t=localStorage.getItem('blog.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="/js/bundle.css">
  <link rel="stylesheet" href="/css/main.css">

 </head>
<body>
