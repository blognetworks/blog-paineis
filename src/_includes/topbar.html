 <div id="topbarRight">
    <!-- 捐赠图标 -->
    <button type="button" class="icon-button" id="donate" title="Apoiar" aria-label="Apoiar" onclick="alert('Donate: {{site.Phone}}')">

    </button>
    <!-- 显隐文件结构栏-->
    <button type="button" class="icon-button" id="topbarStructureToggle" title="Mostrar ou ocultar sumário" aria-label="Mostrar ou ocultar sumário">

    </button>
    <!-- Tema: sistema → claro → escuro (webpack/js/theme.js) -->
    <button id="themeToggle" class="icon-button" type="button" aria-label="Tema: sistema" title="Tema: sistema">
      <svg class="icon" aria-hidden="true"><use href="#i-monitor"></use></svg>
