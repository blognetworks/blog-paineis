{% include header.html %}      <!-- 所有文章头部 -->

<div id="bigDiv">          
	{% include icons.svg %}
	{% include topbar.html %}
	{% include main.html %}
</div>

<!-- Região viva: anuncia o título após a navegação parcial (nav.js). Fora do #contentDiv. -->
<div id="navStatus" class="visually-hidden" role="status" aria-live="polite"></div>
 

<!-- 绝对定位 导航条  右下角: 三个箭头而已. -->
<div id="arrowNav">
	<button type="button" class="icon-button" id="leftBtn" aria-label="Recolher painéis" title="Recolher painéis"><svg class="icon" aria-hidden="true"><use xlink:href="#i-panel-left-close"></use></svg></button>
	<button type="button" class="icon-button" id="toTopBtn" aria-label="Voltar ao topo" title="Voltar ao topo"><svg class="icon" aria-hidden="true"><use xlink:href="#i-arrow-up-to-line"></use></svg></button>
	<button type="button" class="icon-button" id="rightBtn" aria-label="Restaurar painéis" title="Restaurar painéis"><svg class="icon" aria-hidden="true"><use xlink:href="#i-panel-left-open"></use></svg></button>
</div>

{% include footer.html %}   <!-- 所有文章尾部 -->
